name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: shared
    uses: thiagogenez/labflow-platform/.github/workflows/quality-gate.yml@9c4f53eac80f41a53c231fde19d42ed065500f39 # labflow-platform#31; same pin in pull-request.yml
    with:
      go-version-file: libs/go/go.mod

  go-test:
    name: go tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Run every module's tests with the race detector
        run: make test-go

  python-test:
    name: python tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Install the hash-pinned environment and the Python packages
        run: make venv

      - name: Run every Python package's tests
        run: make test-python
