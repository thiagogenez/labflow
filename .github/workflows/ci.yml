name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
          --ignore-gitleaks-allow --timeout 120 .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      OSV_VERSION: "2.7.0"
      OSV_SHA256: 4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify OSV-Scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_arm64"
          printf '%s  %s\n' "$OSV_SHA256" osv-scanner | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Audit pinned Python dependencies
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source
          --lockfile=requirements.txt:requirements-dev.txt

  lint-and-test:
    name: Python quality and tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          architecture: arm64
      - name: Install pinned development tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-dev.txt
      - name: Install local package
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Verify native ARM64 execution
        run: |
          python - <<'PY'
          import platform

          print(f"Python {platform.python_version()} on {platform.machine()}")
          assert platform.machine() == "aarch64"
          PY
      - name: Check lint
        run: ruff check --no-cache .
      - name: Check formatting
        run: black --check --diff .
      - name: Check Pylint diagnostics
        run: pylint --persistent=n src/labflow tests
      - name: Run unit tests
        run: python -m pytest -v
