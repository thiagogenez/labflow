# Shared by every Go module, the editor (VS Code) and CI.
version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        # Every package and exported name has a doc comment (D57).
        - name: exported
        - name: package-comments

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thiagogenez/labflow
