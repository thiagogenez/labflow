# One hook configuration for local commits and CI.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    # v8.30.1 was tagged off a release branch, so autoupdate cannot see it.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-metaschema
        name: event schemas are valid JSON Schema
        files: ^contracts/events/[^/]+\.schema\.json$
      - id: check-jsonschema
        name: order.placed example matches its schema
        files: ^contracts/events/
        pass_filenames: false
        args:
          - --schemafile
          - contracts/events/labflow.order.placed.v1.schema.json
          - contracts/events/examples/labflow.order.placed.v1.json

  # golangci-lint runs once per Go module (scripts/lint_go_modules.sh); the
  # hook only pins and builds the binary.
  - repo: https://github.com/golangci/golangci-lint
    rev: 25c5369a93aacb8cccea0d46e1569ca4a194564d  # frozen: v2.15.0
    hooks:
      - id: golangci-lint-full
        name: golangci-lint, gofmt, goimports and go mod tidy in every Go module
        entry: scripts/lint_go_modules.sh
        types: [file]
        types_or: [go, go-mod, go-sum]
      - id: golangci-lint-config-verify

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        language: docker_image
        entry: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
        types: [dockerfile]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # .github/scripts/check_pull_request.sh mirrors this hook's types for pull request titles.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # .github/scripts/check_pull_request.sh mirrors the attribution pattern; change both together.
  - repo: local
    hooks:
      # ponytail: pygrep counts bytes, exact for the English subjects used here.
      - id: commit-subject-length
        name: commit subject is at most 72 characters
        language: pygrep
        entry: '\A[^\n]{73,}'
        args: [--multiline]
        stages: [commit-msg]
      - id: no-attribution-lines
        name: commit message has no attribution lines
        language: pygrep
        entry: '(?im)^(co-authored-by:|[^\w\n]*generated (with|by) [^\n]{0,40}?\b(claude|copilot|chatgpt|codex|cursor|gemini)\b)'
        args: [--multiline]
        stages: [commit-msg]
      - id: ticket-reference
        name: commit message has a Refs line naming an issue
        language: pygrep
        entry: '(?m)(\A(Merge|fixup!|squash!|amend!) |^Refs: thiagogenez/labflow-platform#[1-9][0-9]*[ \t]*\r?$)'
        args: [--multiline, --negate]
        stages: [commit-msg]
