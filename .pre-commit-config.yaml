# One hook configuration for local commits and CI.
# Hooks for Terraform, Ansible, Helm, Kubernetes manifests, shell scripts and
# application code are added with the first files of each type.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    # v8.30.1 was tagged off a release branch, so autoupdate cannot see it.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # ponytail: pygrep counts bytes, exact for the English subjects used here.
      - id: commit-subject-length
        name: commit subject is at most 72 characters
        language: pygrep
        entry: '\A[^\n]{73,}'
        args: [--multiline]
        stages: [commit-msg]
      - id: no-co-author-trailer
        name: commit message has no co-author trailer
        language: pygrep
        entry: '(?im)^co-authored-by:'
        args: [--multiline]
        stages: [commit-msg]
