[project]
name = "labflow"
version = "0.1.0"
description = "Code shared by LabFlow's Python services."
requires-python = ">=3.14"
dependencies = [
    "opentelemetry-api>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-sdk>=1.38",
    "pika>=1.5",
    "prometheus-client>=0.23",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Test helpers stay out of the wheel, and so out of service images.
[tool.hatch.build.targets.wheel]
exclude = ["src/labflow/containers.py"]

# Empty on purpose: it makes this file Ruff's configuration root, so Ruff
# groups this package's imports alike from any directory. The rules stay
# Ruff's defaults.
[tool.ruff]

[tool.pytest.ini_options]
testpaths = ["tests"]
