# Local development environment: docker compose up --build
# psp-simulator stands in for an external card payment provider.
name: labflow

x-go-build: &go-build
  context: .
  dockerfile: services/go.Dockerfile

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# The container rules from AGENTS.md: non-root (the image), read-only root
# filesystem, no Linux capabilities, no privilege escalation.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Changes whenever a secret does (see the Makefile), so Compose recreates the
# services that read one.
x-secrets-generation: &secrets-generation
  labflow.secrets-generation: ${LABFLOW_SECRETS_GENERATION:-}

x-healthcheck: &healthcheck
  test: ["CMD", "/service", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 12

# Generated in .secrets/ by `make up` (D40).
secrets:
  postgres-superuser: { file: ./.secrets/postgres-superuser }
  psp-owner: { file: ./.secrets/psp-owner }
  psp-app: { file: ./.secrets/psp-app }
  payment-owner: { file: ./.secrets/payment-owner }
  payment-app: { file: ./.secrets/payment-app }
  orders-owner: { file: ./.secrets/orders-owner }
  orders-app: { file: ./.secrets/orders-app }
  psp-secret-key: { file: ./.secrets/psp-secret-key }
  order-token-key: { file: ./.secrets/order-token-key }
  rabbitmq-order-api: { file: ./.secrets/rabbitmq-order-api }
  rabbitmq-definitions.json: { file: ./.secrets/rabbitmq-definitions.json }

services:
  postgres:
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser
    secrets: [postgres-superuser]
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
    healthcheck:
      # TCP, not the socket: during first-boot init the socket answers before TCP does.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates each service's database and roles if missing, on every start, so
  # a volume from an older revision gets the databases a newer one adds.
  postgres-provision:
    <<: *hardening
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    user: postgres
    entrypoint: ["bash", "/provision.sh"]
    labels: *secrets-generation
    secrets: [psp-owner, psp-app, payment-owner, payment-app, orders-owner, orders-app]
    volumes:
      - ./compose/postgres/provision.sh:/provision.sh:ro
      # The server's Unix socket, which it trusts: whatever mounts it is the
      # superuser. Only this job and the server may.
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres: { condition: service_healthy }

  # The topology, users and permissions come from definitions.template.json
  # with the users' passwords filled in (D70).
  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.4.1-management@sha256:61f90c401a5b5ed2486771973ea92ad66046471eacab9c9149f1a6e091c91677
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>: without
    # a fixed hostname, a recreated container starts empty on the same volume.
    hostname: rabbitmq
    user: rabbitmq
    mem_limit: 1g # repeated in labflow.conf
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./compose/rabbitmq/labflow.conf:/etc/rabbitmq/conf.d/90-labflow.conf:ro
    labels: *secrets-generation
    secrets: [rabbitmq-definitions.json]
    ports:
      - "127.0.0.1:15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 24

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686" # trace UI

  psp-simulator-migrate:
    <<: *hardening
    image: labflow/psp-simulator:local
    build:
      <<: *go-build
      args: { SERVICE: psp-simulator }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://psp_owner@postgres:5432/psp?sslmode=disable
      MIGRATIONS_DATABASE_PASSWORD_FILE: /run/secrets/psp-owner
    labels: *secrets-generation
    secrets: [psp-owner]
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  psp-simulator:
    <<: *hardening
    image: labflow/psp-simulator:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: psp-simulator }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://psp_app@postgres:5432/psp?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/psp-app
      PUBLISHABLE_KEY: pk_test_local # public by design, like a card form's key
      SECRET_KEY_FILE: /run/secrets/psp-secret-key
    labels: *secrets-generation
    secrets: [psp-app, psp-secret-key]
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck: *healthcheck
    depends_on:
      psp-simulator-migrate: { condition: service_completed_successfully }

  payment-api-migrate:
    <<: *hardening
    image: labflow/payment-api:local
    build:
      <<: *go-build
      args: { SERVICE: payment-api }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://payment_owner@postgres:5432/payment?sslmode=disable
      MIGRATIONS_DATABASE_PASSWORD_FILE: /run/secrets/payment-owner
    labels: *secrets-generation
    secrets: [payment-owner]
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  payment-api:
    <<: *hardening
    image: labflow/payment-api:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: payment-api }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://payment_app@postgres:5432/payment?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/payment-app
      PSP_BASE_URL: http://psp-simulator:8080
      PSP_SECRET_KEY_FILE: /run/secrets/psp-secret-key
    labels: *secrets-generation
    secrets: [payment-app, psp-secret-key]
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck: *healthcheck
    depends_on:
      payment-api-migrate: { condition: service_completed_successfully }
      psp-simulator: { condition: service_healthy }

  order-api-migrate:
    <<: *hardening
    image: labflow/order-api:local
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://orders_owner@postgres:5432/orders?sslmode=disable
      MIGRATIONS_DATABASE_PASSWORD_FILE: /run/secrets/orders-owner
    labels: *secrets-generation
    secrets: [orders-owner]
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  # Loads the catalogue file with the data role, as a job like the migrations (D68).
  order-api-catalogue:
    <<: *hardening
    image: labflow/order-api:local
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    command: ["catalogue", "import", "/etc/order-api/catalogue.json"]
    environment:
      DATABASE_URL: postgres://orders_app@postgres:5432/orders?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/orders-app
    labels: *secrets-generation
    secrets: [orders-app]
    volumes:
      - ./services/order-api/catalogue.json:/etc/order-api/catalogue.json:ro
    depends_on:
      order-api-migrate: { condition: service_completed_successfully }

  order-api:
    <<: *hardening
    image: labflow/order-api:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://orders_app@postgres:5432/orders?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/orders-app
      PAYMENT_API_URL: http://payment-api:8080
      FLAT_RATES_FILE: /etc/order-api/flat-rates.json
      ORDER_TOKEN_KEY_FILE: /run/secrets/order-token-key
      BROKER: rabbitmq
      RABBITMQ_URL: amqp://order-api@rabbitmq:5672/labflow
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq-order-api
    labels: *secrets-generation
    secrets: [orders-app, order-token-key, rabbitmq-order-api]
    volumes:
      - ./services/order-api/flat-rates.json:/etc/order-api/flat-rates.json:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck: *healthcheck
    depends_on:
      order-api-catalogue: { condition: service_completed_successfully }
      payment-api: { condition: service_healthy }
      # Started, not healthy: checkout works without the broker, and the
      # outbox relay retries until RabbitMQ answers.
      rabbitmq: { condition: service_started }

volumes:
  postgres-data:
  postgres-socket:
  rabbitmq-data:
