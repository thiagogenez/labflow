# Local development environment: docker compose up --build
# psp-simulator stands in for an external card payment provider.
name: labflow

x-go-build: &go-build
  context: .
  dockerfile: services/go.Dockerfile

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# The container rules from AGENTS.md: non-root (the image), read-only root
# filesystem, no Linux capabilities, no privilege escalation.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-healthcheck: &healthcheck
  test: ["CMD", "/service", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 12

services:
  postgres:
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_PASSWORD: postgres # local only; the port is not published
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during first-boot init the socket answers before TCP does.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates each service's database and roles if missing, on every start, so
  # a volume from an older revision gets the databases a newer one adds.
  postgres-provision:
    <<: *hardening
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    user: postgres
    entrypoint: ["bash", "/provision.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres # local only; the port is not published
    volumes:
      - ./compose/postgres/provision.sh:/provision.sh:ro
    depends_on:
      postgres: { condition: service_healthy }

  # The topology, users and permissions come from definitions.json (D70). The
  # passwords repeat the user names: the AMQP port is reachable only inside
  # the Compose network, and the clusters take credentials from Vault.
  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.4.1-management@sha256:61f90c401a5b5ed2486771973ea92ad66046471eacab9c9149f1a6e091c91677
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>: without
    # a fixed hostname, a recreated container starts empty on the same volume.
    hostname: rabbitmq
    user: rabbitmq
    mem_limit: 1g # repeated in labflow.conf
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./compose/rabbitmq/labflow.conf:/etc/rabbitmq/conf.d/90-labflow.conf:ro
      - ./compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 24

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686" # trace UI

  psp-simulator-migrate:
    <<: *hardening
    image: labflow/psp-simulator:local
    build:
      <<: *go-build
      args: { SERVICE: psp-simulator }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://psp_owner:psp_owner@postgres:5432/psp?sslmode=disable
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  psp-simulator:
    <<: *hardening
    image: labflow/psp-simulator:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: psp-simulator }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://psp_app:psp_app@postgres:5432/psp?sslmode=disable
      PUBLISHABLE_KEY: pk_test_local
      SECRET_KEY: sk_test_local
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck: *healthcheck
    depends_on:
      psp-simulator-migrate: { condition: service_completed_successfully }

  payment-api-migrate:
    <<: *hardening
    image: labflow/payment-api:local
    build:
      <<: *go-build
      args: { SERVICE: payment-api }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://payment_owner:payment_owner@postgres:5432/payment?sslmode=disable
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  payment-api:
    <<: *hardening
    image: labflow/payment-api:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: payment-api }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://payment_app:payment_app@postgres:5432/payment?sslmode=disable
      PSP_BASE_URL: http://psp-simulator:8080
      PSP_SECRET_KEY: sk_test_local
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck: *healthcheck
    depends_on:
      payment-api-migrate: { condition: service_completed_successfully }
      psp-simulator: { condition: service_healthy }

  order-api-migrate:
    <<: *hardening
    image: labflow/order-api:local
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    command: ["migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://orders_owner:orders_owner@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  # Loads the catalogue file with the data role, as a job like the migrations (D68).
  order-api-catalogue:
    <<: *hardening
    image: labflow/order-api:local
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    command: ["catalogue", "import", "/etc/order-api/catalogue.json"]
    environment:
      DATABASE_URL: postgres://orders_app:orders_app@postgres:5432/orders?sslmode=disable
    volumes:
      - ./services/order-api/catalogue.json:/etc/order-api/catalogue.json:ro
    depends_on:
      order-api-migrate: { condition: service_completed_successfully }

  order-api:
    <<: *hardening
    image: labflow/order-api:local
    stop_grace_period: 30s # > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, as in Kubernetes
    build:
      <<: *go-build
      args: { SERVICE: order-api }
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://orders_app:orders_app@postgres:5432/orders?sslmode=disable
      PAYMENT_API_URL: http://payment-api:8080
      FLAT_RATES_FILE: /etc/order-api/flat-rates.json
      # Local only, not a secret: the clusters read the key from Vault (D56).
      ORDER_TOKEN_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg= # 32 times x
      BROKER: rabbitmq
      RABBITMQ_URL: amqp://order-api:order-api@rabbitmq:5672/labflow
    volumes:
      - ./services/order-api/flat-rates.json:/etc/order-api/flat-rates.json:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck: *healthcheck
    depends_on:
      order-api-catalogue: { condition: service_completed_successfully }
      payment-api: { condition: service_healthy }
      # Started, not healthy: checkout works without the broker, and the
      # outbox relay retries until RabbitMQ answers.
      rabbitmq: { condition: service_started }

volumes:
  postgres-data:
  rabbitmq-data:
