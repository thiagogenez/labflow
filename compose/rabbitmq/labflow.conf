# Loads the topology and users at boot (D70), in Docker Compose and in the
# tests, from definitions.template.json with each user's password filled in,
# mounted as a secret; an import only adds, never deletes.
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/rabbitmq-definitions.json
# RabbitMQ does not read the container's memory limit; this matches mem_limit
# in compose.yaml, so the memory alarm (60 %) fires before the kernel kills it.
total_memory_available_override_value = 1GiB
# The default, 50 MB, is meant for development; below this free space the
# disk alarm blocks every publisher.
disk_free_limit.absolute = 1GB
